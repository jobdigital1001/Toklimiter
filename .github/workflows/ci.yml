name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genius
          POSTGRES_PASSWORD: genius
          POSTGRES_DB: genius_jobportal_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U genius" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://genius:genius@localhost:5432/genius_jobportal_test
      E2E_DATABASE_URL: postgresql://genius:genius@localhost:5432/genius_jobportal_test
      E2E_RESET_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
